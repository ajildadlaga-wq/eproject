# Supabase CLI configuration for the PMS project.
# Docs: https://supabase.com/docs/guides/cli/config
project_id = "pms"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
# Signing up must not hand out a session. The account waits until the person
# proves they own the address. Seeded demo users are created through the admin
# API, which marks them confirmed, so local development is unaffected.
enable_confirmations = true

[functions.admin-create-user]
verify_jwt = true
